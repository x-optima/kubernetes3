# Deployment приложения из двух контейнеров: nginx и multitool.
#
# Контейнеры пода делят общий сетевой namespace, поэтому два nginx на порту 80
# ужиться не могут: внутри образа wbitt/network-multitool тоже работает nginx.
# Порт внутреннего nginx мультитула сдвинут на 8080 переменной HTTP_PORT.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-multitool
  labels:
    app: nginx-multitool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-multitool
  template:
    metadata:
      labels:
        app: nginx-multitool
    spec:
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80
        - name: multitool
          image: wbitt/network-multitool
          env:
            - name: HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
